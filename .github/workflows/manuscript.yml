name: Build manuscript

on:
  push:
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript.yml'
  pull_request:
    paths: ['manuscript/**']
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # Fails the build if the manuscript cites a key references.bib lacks —
      # LaTeX only reports that as a "[?]" in the output, which is easy to miss.
      - name: Check citations resolve
        run: python3 scripts/check_citations.py

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-science \
            texlive-fonts-recommended lmodern latexmk

      - name: Build PDF
        run: make -C manuscript

      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: manuscript/manuscript_npj.pdf
          if-no-files-found: error
